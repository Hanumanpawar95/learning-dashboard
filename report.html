<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Report</title>

<style>

body{
font-family:Arial,sans-serif;
background:#ffffff;
padding:20px;
text-align:center;
}

h2,h3{
margin-bottom:10px;
}

#eligibilityDashboard{
margin:20px 0;
}

.dashboard-container{
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
margin-bottom:20px;
}

.dashboard-card{
background:#fff;
padding:15px;
min-width:180px;
border-radius:10px;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.15);
transition:.3s;
}

.dashboard-card:hover{
transform:translateY(-3px);
}

.green-card{
border-left:5px solid #28a745;
}

.blue-card{
border-left:5px solid #2196f3;
}

.dashboard-card h3{
margin:0;
}

.dashboard-count{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.green-count{
color:#28a745;
}

.blue-count{
color:#2196f3;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
font-size:14px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

th{
background:#4caf50;
color:white;
}

.eligible{
background:#c8e6c9;
}

.not-eligible{
background:#ffcdd2;
}

textarea.comment-box{
width:100%;
height:40px;
}

button{
margin-top:20px;
background:#2196f3;
color:white;
border:none;
padding:10px 20px;
cursor:pointer;
}

button:hover{
background:#1976d2;
}

/* Popup */

#eligibleModal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
z-index:99999;
}

.modal-content{
background:white;
width:650px;
max-height:80vh;
overflow:auto;
margin:50px auto;
padding:20px;
border-radius:10px;
text-align:left;
}

.modal-content h2{
text-align:center;
}


</style>
</head>

<body>

<h2>📋 Batch Report</h2>

<p>
<strong>Center Code:</strong>
<span id="centerCodeDisplay"></span>
</p>

<h3 id="batchTitle"></h3>

<p>
<strong>Uploaded By:</strong>
<span id="uploadedBy"></span>
</p>

<p>
<strong>Date:</strong>
<span id="uploadDate"></span>
</p>

<button id="downloadPDF">
📥 Download PDF
</button>

<div id="button-container" style="margin-top:20px;"></div>

<div id="eligibilityDashboard"></div>

<div id="eligibleModal">
<div class="modal-content" style="
background:white;
width:800px;
max-width:95%;
max-height:80vh;
overflow:auto;
margin:50px auto;
padding:20px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
">

<h2 id="eligibleTitle">
Eligible Learners
</h2>

<table style="
width:100%;
border-collapse:collapse;
margin-top:10px;
">

<thead>
<tr style="
background:#4CAF50;
color:white;
">
<th style="padding:8px;">Learner Code</th>
<th style="padding:8px;">Learner Name</th>
<th style="padding:8px;">Sessions</th> </tr>
</tr>
</thead>

<tbody id="eligibleList">
</tbody>

</table>

<div style="text-align:center;">

<button onclick="
document.getElementById('eligibleModal').style.display='none';
" style="
background:#f44336;
color:white;
border:none;
padding:10px 20px;
border-radius:6px;
cursor:pointer;
margin-top:15px;
">
✖ Close
</button>

</div>

</div>

</div>

<table id="reportTable">

<thead>

<tr id="table-header-row"></tr>

</thead>

<tbody id="table-body"></tbody>

</table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script src="script.js?v=1.1"></script>
</body>
</html>
